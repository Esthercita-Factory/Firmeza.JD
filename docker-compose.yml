services:
  db:
    image: postgres:15
    container_name: firmeza_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: firmeza_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d firmeza_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: firmeza_web
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=firmeza_db;Username=postgres;Password=mysecretpassword
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - recibos_data:/app/wwwroot/recibos

volumes:
  pgdata:
  recibos_data:
